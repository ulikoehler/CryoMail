; cryomail configuration — every key can also be given on the command
; line (command line wins over this file).
;
; Usage: cryomail -c backup.ini [overrides...]

[imap]
host = imap.example.com
port = 993
username = you@example.com
; password = better-use-the-CRYOMAIL_PASSWORD-env-var
; If no password is configured anywhere, it is prompted interactively.

[backup]
output = ./mail-backup
jobs = 4            ; parallel IMAP connections
batch_size = 32     ; messages per FETCH command
; folders = INBOX, Archive   ; optional: limit to these mailboxes

; Optional: after each sync, snapshot the maildir into a restic repository
; (`restic -r <repo> backup <output>`). Repo can also come from
; RESTIC_REPOSITORY; the restic process inherits the environment, so
; RESTIC_PASSWORD / RESTIC_PASSWORD_FILE / RESTIC_PASSWORD_COMMAND work.
; [restic]
; repo = /mnt/backups/mail    ; or s3:..., sftp:..., rest:..., etc.
; tag = cryomail          ; snapshot tag
; args = --exclude "*.tmp"    ; extra args for `restic backup`
