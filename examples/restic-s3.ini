; Backup to a local maildir AND a restic repository on S3-compatible
; storage (AWS, MinIO, Wasabi, ...). Credentials via environment:
;   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, RESTIC_PASSWORD
;
; Usage:
;   export AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=...
;   export RESTIC_PASSWORD=...
;   export CRYOMAIL_PASSWORD=...
;   cryomail -c restic-s3.ini

[imap]
host = imap.example.com
username = you@example.com

[backup]
output = /var/spool/cryomail/you@example.com
jobs = 4

[restic]
repo = s3:s3.amazonaws.com/my-bucket/mail
tag = cryomail
