; Gmail backup. Requires:
;   1. IMAP enabled in Gmail settings (Settings > Forwarding and POP/IMAP)
;   2. An app password: Google Account > Security > 2-Step Verification >
;      App passwords  (a normal password does NOT work)
; Gmail exposes labels as folders; "[Gmail]/All Mail" contains every message,
; so backing it up alone already covers all labeled mail.
;
; Usage: cryomail -c gmail.ini

[imap]
host = imap.gmail.com
port = 993
username = you@gmail.com
; password = your-16-char-app-password   ; or use CRYOMAIL_PASSWORD env

[backup]
output = ~/backups/gmail
jobs = 4
batch_size = 32
; Gmail's All Mail duplicates every labeled message; to avoid double storage
; either back up ONLY All Mail, or exclude it:
; folders = [Gmail]/All Mail
