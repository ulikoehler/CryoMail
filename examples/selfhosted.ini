; Self-hosted Dovecot / generic IMAP server.
;
; Usage: cryomail -c selfhosted.ini

[imap]
host = mail.example.com
port = 993
username = you@example.com
tls = auto               ; auto | tls | starttls | none
; tls = starttls         ; if the server only offers STARTTLS on 143
; password = ...

[backup]
output = /var/backups/mail/you@example.com
jobs = 8                 ; self-hosted servers usually tolerate more
batch_size = 64

[restic]
repo = sftp:backup.example.com:/srv/restic/mail/you@example.com
tag = cryomail
; args = --exclude "tmp" --one-file-system
