[package]
name = "cryomail"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Incremental, strictly read-only IMAP backup to maildir + optional restic snapshots"
repository = "https://github.com/ulikoehler/CryoMail"
keywords = ["imap", "backup", "maildir", "restic", "email"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
configparser = "3.3.0"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
imap-proto = "0.16.7"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "2.0.1"
